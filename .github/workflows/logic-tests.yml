name: Logic Tests

on:
  push:
    branches: [ main, "feature/*", "refactor/*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  logic-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Logic Tests
        run: dotnet run --project "muse dash test.LogicTests/muse dash test.LogicTests.csproj" --configuration Release

      - name: Build SignatureDumper (net8.0)
        run: dotnet build "SignatureDumper/SignatureDumper.csproj" -f net8.0 --configuration Release
